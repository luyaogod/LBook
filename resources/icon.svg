<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    LBook's application icon: the same lucide "book-open" glyph the app header
    uses, black on a white rounded square (the shape DeepSeek Harness uses).

    The shadow and the hairline edge are not decoration. A plain white square on
    a white background (Alt-Tab, a light taskbar) shows no edge at all, so the
    rounding is invisible; the soft shadow is what makes the shape read.

    Kept as a vector source so resources/icon.ico can be regenerated at every
    size Windows asks for; see BUILD.md §7 for the command.
  -->
  <defs>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="13" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect x="44" y="44" width="424" height="424" rx="98" ry="98"
        fill="#ffffff" stroke="rgba(0,0,0,0.10)" stroke-width="2" filter="url(#drop)" />
  <g transform="translate(101 101) scale(12.9)"
     fill="none" stroke="#111111" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v16" />
    <path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" />
  </g>
</svg>
