appId: com.luyao.lbook
productName: LBook
copyright: Copyright © 2026 luyao

directories:
  output: release
  buildResources: resources

# Only the compiled output is shipped; sources never reach the installer.
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - "!**/*.map"

asar: true

# No native modules are bundled, and none are needed: the index that used to be
# better-sqlite3 is three JSON files the main process reads and writes, and the
# one-time converter that read the old packages has been deleted (its work is done).
win:
  target:
    - target: nsis
      arch: [x64]
  # resources/icon.ico is used when present; Electron's default is used otherwise.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LBook
  artifactName: ${productName}-Setup-${version}.${ext}

# electron-updater reads this at build time and writes app-update.yml into the
# installer; the owner/repo must be real or every update check fails silently.
publish:
  provider: github
  owner: luyaogod
  repo: LBook
  releaseType: release
